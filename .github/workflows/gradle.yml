name: Build and test with Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Release iOS framework linking needs more memory than the macOS runner has
      # (~6 GB Gradle daemon peak) and swaps for 15+ min per framework, so link
      # debug frameworks only. They verify the same code, minus LLVM optimization.
      - name: Build with Gradle
        run: >
          ./gradlew
          :androidApp:assembleDebug
          :androidApp:lintDebug
          :composeApp:linkDebugFrameworkIosSimulatorArm64
          :composeApp:linkDebugFrameworkIosArm64
